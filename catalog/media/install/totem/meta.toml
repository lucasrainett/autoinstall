name = "Videos (Totem)"
description = "GNOME video player that ships preinstalled on Ubuntu-family desktops"
website = "https://gitlab.gnome.org/GNOME/totem"

capabilities = ["video-playback"]

[linux]
installMethod = "apt"
notes = "Preinstalled on most Ubuntu-family desktops, so it usually starts already selected. Unchecking it purges the package."
requiresElevation = true
