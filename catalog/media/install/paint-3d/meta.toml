name = "Paint 3D"
description = "Microsoft's 3D paint app, retired and pulled from the Store in November 2024"
website = "https://learn.microsoft.com/en-us/windows/whats-new/deprecated-features-resources#paint-3d"

capabilities = ["3d-modeling", "raster-graphics", "3d-viewing"]

[windows]
installMethod = "script"
notes = "Preinstalled, so it usually starts already selected. Unchecking it removes the package for the current user; it can be reinstalled from the Microsoft Store. Classic Paint is a different package and is deliberately left alone."
