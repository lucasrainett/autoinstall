name = "Claude Desktop"
description = "Anthropic's desktop application for Claude"
kind = "install"
website = "https://claude.com/download"

capabilities = ["ai-chat", "ai-coding-assistant", "desktop-automation"]

[linux]
installMethod = "apt"
notes = "Anthropic's own apt repository at downloads.claude.ai, which is where this machine's copy came from. Separate from the Claude Code CLI, which has its own entry."
requiresElevation = true

[macos]
installMethod = "homebrew"

[windows]
installMethod = "winget"
