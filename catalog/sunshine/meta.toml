name = "Sunshine"
description = "Self-hosted game-stream host that Moonlight clients connect to"
kind = "install"
website = "https://app.lizardbyte.dev/Sunshine/"

capabilities = ["game-streaming-host"]

[linux]
installMethod = "flatpak"
notes = "Streaming input to the host needs access to /dev/uinput; Sunshine's own docs cover the udev rule if input does not work after install."

[windows]
installMethod = "winget"
