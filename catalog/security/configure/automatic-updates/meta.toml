name = "Automatic security updates"
description = "Applies security updates automatically in the background, so a machine stays patched without being tended"

[linux]
installMethod = "apt"
notes = "Installs unattended-upgrades and enables the periodic update/upgrade switches. Only Ubuntu's security origin is applied automatically — the default — so it will not silently pull in unrelated version changes."
requiresElevation = true

[macos]
installMethod = "script"
notes = "Enables automatic checking, downloading and installation of system security updates via softwareupdate's preferences."
requiresElevation = true
