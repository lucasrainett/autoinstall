name = "Firewall"
description = "Enables the operating system's built-in firewall, blocking unsolicited incoming connections"

[linux]
installMethod = "script"
notes = "Uses ufw, installing it if absent. Existing rules are left untouched; only the enabled state changes."
requiresElevation = true

[macos]
installMethod = "script"
notes = "Enables the built-in application firewall via socketfilterfw."
requiresElevation = true

[windows]
installMethod = "script"
notes = "Enables Windows Defender Firewall for all three profiles (domain, private, public)."
requiresElevation = true
