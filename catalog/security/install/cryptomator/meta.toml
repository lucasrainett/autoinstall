name = "Cryptomator"
description = "Client-side encrypted vaults for files stored in any cloud service"
website = "https://cryptomator.org"

capabilities = ["encryption"]

[linux]
installMethod = "appimage"
notes = "Uses the vendor's primary Linux download. The Flathub build is sandboxed and cannot reach vaults outside the paths it is granted, so it is not used here. Integrated with Gear Lever for the launcher entry, icon, and updates."

[macos]
installMethod = "homebrew"

[windows]
installMethod = "winget"
