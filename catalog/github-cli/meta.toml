name = "GitHub CLI"
description = "Official command line tool for managing GitHub pull requests, issues, repos, and Actions"
kind = "install"
website = "https://cli.github.com"

capabilities = ["version-control", "terminal-tools"]

[linux]
installMethod = "apt"
notes = "Registers GitHub's own apt repo first."
requiresElevation = true

[macos]
installMethod = "homebrew"

[windows]
installMethod = "winget"
