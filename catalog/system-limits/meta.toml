name = "Developer system limits"
description = "Raises inotify watchers and open-file limits, which large projects exhaust"
kind = "configure"
website = "https://www.kernel.org/doc/html/latest/admin-guide/sysctl/fs.html"

capabilities = ["system-limits"]

[linux]
installMethod = "script"
notes = "Carried over from the old repo. File watchers run out silently — editors and bundlers just stop noticing changes — so the failure this prevents is one that never announces itself. Written as two drop-in files, removed by deleting exactly those files."
requiresElevation = true

[macos]
installMethod = "script"
notes = "Only the open-file half applies: macOS has no inotify. Installed as a LaunchDaemon because `launchctl limit` alone does not survive a reboot, and an entry whose effect disappears overnight is worse than one that never applied."
requiresElevation = true
