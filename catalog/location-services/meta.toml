name = "Disable location services"
description = "Stops Windows and its apps asking the system for your location"
kind = "configure"
website = "https://support.microsoft.com/en-us/windows/windows-location-service-and-privacy-3a8eee0a-5b0b-dc07-eede-2a5ca1c49088"

capabilities = ["location-services"]

[windows]
installMethod = "script"
notes = "A machine-wide policy, so it covers every account. Applications that genuinely need location — Maps, Weather — will report it as unavailable rather than failing outright."
requiresElevation = true
