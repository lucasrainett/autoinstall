name = "Browserosaurus"
description = "Chooses which browser opens a link each time you click one"
kind = "install"
website = "https://github.com/will-stone/browserosaurus"

capabilities = ["link-routing"]

[macos]
installMethod = "homebrew"
notes = """
**No longer maintained.** The author archived the repository in August 2025 and its README says \
so; browserosaurus.com now shows "Download (Coming Soon)". The Homebrew cask still installs \
v20.12.0, so it works today, but it will get no fixes for future macOS versions.

Kept because it is the closest match to Junction's behaviour — a chooser that pops up for every \
link. Finicky is the maintained alternative for the same capability and decides by rule instead.

Verified live against formulae.brew.sh — cask `browserosaurus`.
"""
