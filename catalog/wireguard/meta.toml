name = "WireGuard"
description = "Fast, modern VPN tunnel"
kind = "install"
website = "https://www.wireguard.com/"

capabilities = ["vpn", "mesh-vpn"]

[linux]
installMethod = "apt"
requiresElevation = true

[macos]
installMethod = "homebrew"

[windows]
installMethod = "winget"
notes = "The tools, not a configuration: this installs WireGuard and leaves your tunnels alone."
