name = "Auto-hide the dock"
description = "Hides the dock or taskbar until you reach for it, reclaiming the screen space"
website = "https://support.apple.com/guide/mac-help/change-dock-settings-mchlp1119/mac"

[macos]
installMethod = "script"
notes = "Sets Dock auto-hide and removes the show delay, then restarts the Dock so it applies immediately."

[windows]
installMethod = "script"
notes = "Sets the taskbar's auto-hide bit and restarts Explorer to apply it. Linux is deliberately absent: GNOME, Zorin and KDE each use a different dock with different settings, and there is no single mechanism to write."
