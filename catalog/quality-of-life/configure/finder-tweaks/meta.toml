name = "Finder and dialog defaults"
description = "Shows hidden files and extensions, adds the path bar, and expands save/print dialogs by default"
website = "https://support.apple.com/guide/mac-help/change-finder-preferences-mchlp3011/mac"

[macos]
installMethod = "script"
notes = "Carried over from the old repo's macOS system_tweaks. The firewall half of that script is a separate entry (security/configure/firewall) rather than being bundled here — turning on a firewall is not a Finder preference, and mixing them would mean unchecking one to revert the other."
