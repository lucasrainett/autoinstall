name = "Distrobox"
description = "Runs any Linux distribution's tools inside a container, integrated with the host"
kind = "install"
website = "https://distrobox.it/"

capabilities = ["containers", "terminal-tools"]

[linux]
installMethod = "apt"
notes = "Linux only: it builds on podman/docker plus host integration that has no macOS or Windows counterpart. DistroShelf, its GUI, has its own entry."
requiresElevation = true
