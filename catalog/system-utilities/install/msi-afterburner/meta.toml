name = "MSI Afterburner"
description = "Sets GPU fan curves, clock offsets and power limits, for AMD and NVIDIA alike"
website = "https://www.msi.com/Landing/afterburner"

capabilities = ["gpu-tuning", "system-monitoring", "game-overlay", "screen-recording"]

[windows]
installMethod = "winget"
notes = """
Verified live in microsoft/winget-pkgs at manifests/g/Guru3D/Afterburner (4.6.5, plus a 4.6.6 \
beta). Bundles RivaTuner Statistics Server.

Deliberately not GPU-Z or CPU-Z: those are read-only monitors and cannot set a fan curve or a \
power limit. Monitoring is the `system-monitoring` capability, which is a different row.
"""
