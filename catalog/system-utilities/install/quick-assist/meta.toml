name = "Quick Assist"
description = "Microsoft's remote-assistance tool"
website = "https://www.microsoft.com/"

[windows]
installMethod = "script"
notes = "Preinstalled, so it usually starts already selected. Unchecking it removes the package for the current user; it can be reinstalled from the Microsoft Store. Commonly abused in tech-support scams, which is a reason some people remove it."
