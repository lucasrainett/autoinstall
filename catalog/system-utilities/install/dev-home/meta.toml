name = "Dev Home"
description = "Microsoft's developer dashboard and machine setup tool, discontinued in May 2025"
website = "https://learn.microsoft.com/en-us/previous-versions/windows/dev-home/"

capabilities = ["system-monitoring", "version-control", "package-management", "ssh"]

[windows]
installMethod = "script"
notes = "Preinstalled, so it usually starts already selected. Unchecking it removes the package for the current user; it can be reinstalled from the Microsoft Store."
