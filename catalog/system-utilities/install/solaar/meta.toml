name = "Solaar"
description = "Manager for Logitech Unifying receivers and devices"
website = "https://pwr-solaar.github.io/Solaar/"

[linux]
installMethod = "flatpak"
notes = "Linux-only: Logitech ships Options+ on macOS and Windows instead."

[macos]
installMethod = "homebrew"
notes = "Logi Options+ is Logitech's own macOS software; Solaar is the Linux equivalent and does not exist on macOS."

[windows]
installMethod = "winget"
notes = "Logi Options+ is Logitech's own Windows software; Solaar is the Linux-only equivalent."
