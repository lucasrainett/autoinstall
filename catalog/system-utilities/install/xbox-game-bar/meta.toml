name = "Xbox Game Bar"
description = "Microsoft's in-game overlay for capture and performance, preinstalled on Windows"
website = "https://www.xbox.com/"

[windows]
installMethod = "script"
notes = "Preinstalled, so it usually starts already selected. Unchecking it removes the package for the current user only; it can be reinstalled from the Microsoft Store. Separate from the Xbox app: the overlay is its own package and removing one leaves the other."
