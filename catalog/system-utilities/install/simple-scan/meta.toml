name = "Document Scanner"
description = "GNOME document scanner that ships preinstalled on Ubuntu-family desktops"
website = "https://apps.gnome.org/SimpleScan/"

capabilities = ["document-scanning"]

[linux]
installMethod = "apt"
notes = "Preinstalled on most Ubuntu-family desktops, so it usually starts already selected. Unchecking it purges the package."
requiresElevation = true
