name = "Rhythmbox"
description = "Music player that ships preinstalled on Ubuntu-family desktops"
kind = "install"
website = "https://gitlab.gnome.org/GNOME/rhythmbox"

capabilities = ["music-playback"]

[linux]
installMethod = "apt"
notes = "Preinstalled on most Ubuntu-family desktops, so it usually starts already selected. Unchecking it purges the package."
requiresElevation = true
