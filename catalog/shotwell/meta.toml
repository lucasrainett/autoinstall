name = "Shotwell"
description = "GNOME photo manager that ships preinstalled on Ubuntu-family desktops"
kind = "install"
website = "https://shotwell-project.org/"

capabilities = ["photo-management", "raster-graphics"]

[linux]
installMethod = "apt"
notes = "Preinstalled on most Ubuntu-family desktops, so it usually starts already selected. Unchecking it purges the package."
requiresElevation = true
