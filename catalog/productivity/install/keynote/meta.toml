name = "Keynote"
description = "Apple's presentation app, bundled with new Macs and free from the App Store"
website = "https://support.apple.com/keynote"

capabilities = ["presentations"]

[macos]
installMethod = "script"
notes = "Preinstalled on most Macs, so it usually starts already selected. Unchecking it deletes the bundle; it can be reinstalled from the App Store, which is what makes that reversible."
requiresElevation = true
