name = "Brave"
description = "Chromium-based browser with built-in ad and tracker blocking"
website = "https://brave.com/"

[linux]
installMethod = "apt"
notes = "Preinstalled on Zorin OS and some other Ubuntu-family desktops, so it usually starts already selected. Unchecking it removes the browser and stops the machine tracking Brave updates."
requiresElevation = true

[macos]
installMethod = "homebrew"

[windows]
installMethod = "winget"
