name = "btop"
description = "Terminal resource monitor for CPU, memory, disks, network, GPU and processes"
website = "https://github.com/aristocratos/btop"

capabilities = ["system-monitoring", "terminal-tools"]

[linux]
installMethod = "apt"
requiresElevation = true

[macos]
installMethod = "homebrew"

[windows]
installMethod = "winget"
notes = "Installs btop4win, a Windows-specific fork of btop, since the original has no native Windows port."
