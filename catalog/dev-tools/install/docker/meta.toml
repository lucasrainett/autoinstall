name = "Docker"
description = "Container runtime for building and running applications"
website = "https://www.docker.com"

[linux]
installMethod = "apt"
notes = "Registers Docker's own apt repo, installs Docker Engine (not Desktop), enables the daemon, and adds the current user to the docker group (needs a logout/login to take effect)."
requiresElevation = true

[macos]
installMethod = "homebrew"
notes = "Installs Docker Desktop; launch it from Applications once to finish setup."

[windows]
installMethod = "winget"
