name = "WinBoat"
description = "Runs Windows applications on Linux inside a managed Windows VM"
website = "https://github.com/TibixDev/winboat"

[linux]
installMethod = "appimage"
notes = "Carried over from the old repo. Needs Docker or Podman and hardware virtualisation; WinBoat runs a real Windows VM behind the scenes rather than emulating the applications. Managed through Gear Lever like every other AppImage here."
