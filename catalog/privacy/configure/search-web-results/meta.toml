name = "Remove web results from Start search"
description = "Makes the Start menu search your machine instead of also querying Bing"
website = "https://learn.microsoft.com/windows/client-management/mdm/policy-csp-search"

capabilities = ["telemetry-collection", "advertising"]

[windows]
installMethod = "script"
notes = "Every character typed into Start is otherwise sent to Bing as you type. Turning it off makes search local, faster, and quiet. Set in both hives because Windows has moved this policy between them across builds."
requiresElevation = true
