name = "Disable update sharing"
description = "Stops your machine sharing downloaded Windows updates with other PCs"
website = "https://learn.microsoft.com/windows/deployment/do/waas-delivery-optimization"

capabilities = ["system-hardening"]

[windows]
installMethod = "script"
notes = "Delivery Optimization turns your connection into a peer for distributing Microsoft's updates to strangers. DownloadMode 0 keeps updates coming straight from Microsoft. Worth it on a metered or slow connection; harmless otherwise."
requiresElevation = true
