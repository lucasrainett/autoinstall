name = "Network hardening"
description = "Kernel network settings that ignore redirects, source routing and spoofed addresses"
kind = "configure"
website = "https://docs.kernel.org/networking/ip-sysctl.html"

capabilities = ["system-hardening"]

[linux]
installMethod = "script"
notes = "Written as one sysctl drop-in file, removed by deleting exactly that file. Ubuntu already sets several of these sensibly; the entry makes the whole set explicit and survives a distribution changing its defaults. It does not touch IP forwarding — that would break container and VM networking, which this machine's Podman and Boxes both need."
requiresElevation = true
