name = "Angry IP Scanner"
description = "Fast network scanner for finding hosts and open ports"
kind = "install"
website = "https://angryip.org/"

capabilities = ["network-scanning"]

[linux]
installMethod = "flatpak"

[windows]
installMethod = "winget"

[macos]
notes = """
**Not available on macOS.** Homebrew disabled the `angry-ip-scanner` cask on 2026-09-01 with the reason \
`fails_gatekeeper_check`: the app is unsigned, so modern macOS refuses to run it. Installing it by \
direct download instead would hand the user an application Gatekeeper blocks, which is worse than \
not offering it — so this entry has no macOS folder, which is how this catalog expresses "not \
applicable here".

Verified live against formulae.brew.sh, which reports `disabled: true` for the cask.
"""
