name = "Docker"
description = "Container engine for building and running apps; Docker Desktop on macOS and Windows"
kind = "install"
website = "https://www.docker.com"

capabilities = ["containers", "container-gui"]

[linux]
installMethod = "apt"
notes = """
Registers Docker's own apt repo, installs Docker Engine (not Desktop), enables the daemon, and \
adds the current user to the docker group (needs a logout/login to take effect).

Engine is a daemon and a CLI with no GUI, which is why this platform has no run.sh while macOS \
and Windows — where the same entry installs Docker Desktop — do have one.
"""
requiresElevation = true

[macos]
installMethod = "homebrew"
notes = "Installs Docker Desktop; launch it from Applications once to finish setup."

[windows]
installMethod = "winget"
