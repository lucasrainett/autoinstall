name = "Handy"
description = "Push-to-talk speech to text that types into whatever window has focus"
kind = "install"
website = "https://github.com/cjpais/Handy"

capabilities = ["speech-to-text"]

[linux]
installMethod = "flatpak"

[macos]
installMethod = "homebrew"
notes = "The same program: Handy is a Tauri app with real builds for all three. Verified live against formulae.brew.sh — cask `handy`, \"Speech to text application\"."

[windows]
installMethod = "winget"
notes = "Verified live in microsoft/winget-pkgs at manifests/c/cjpais/Handy (v0.9.6). Note winget's search also returns HandyOrg.HandyWinget-GUI, which is an unrelated program — the manifest path is what was checked."
