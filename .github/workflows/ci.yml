# Runs on every push and pull request.
#
# The type-check and unit suite run on all three operating systems, because that is where the tool
# runs. What stays out of here is the *catalog lifecycle* — actually installing real software —
# which lives in catalog-lifecycle.yml because it takes hours and depends on third-party endpoints.
# Those are different things, and an earlier version of this file conflated them: it kept the whole
# of CI on Linux on the grounds that "cross-OS testing lives in the other workflow", which left the
# engine itself verified on one OS out of three.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Type-check and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One OS failing must not cancel the others: "does this break on Windows only" is exactly
      # the question this matrix exists to answer, and it is unanswerable if the run is cancelled.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno task check
      - run: deno task test

  style:
    name: Lint and format
    runs-on: ubuntu-latest
    # Deliberately not on the matrix. Lint rules and formatting are properties of the source text,
    # so all three runners would compute the same answer from the same bytes — three copies of one
    # result, and three chances for a spurious line-ending failure to make the build red.
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno task lint
      # --check rather than rewriting: CI must fail on unformatted code, not silently fix it.
      - run: deno fmt --check src/ main.tsx

  catalog:
    name: Catalog conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Schema validation plus the conventions that are easy to break by hand: every operation
      # script present, the detect exit-code contract, no sudo in detect, AppImages going through
      # Gear Lever, and the duplicated collateral guard not having drifted between copies.
      - name: Load and validate the real catalog
        run: deno run --allow-read --allow-run --allow-env scripts/inspect-catalog.ts

      - name: Convention tests
        run: deno test --allow-all src/catalog/bundled.test.ts src/profiles/bundled.test.ts

      # A parse error here is a broken entry no unit test would catch, since the engine only ever
      # hands these to bash at run time.
      - name: Shell syntax of every catalog script
        run: |
          failed=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "syntax error: $f"; failed=1; }
          done < <(find catalog scripts -name '*.sh'; echo install)
          exit $failed

  windows-invocation:
    name: Git Bash to Windows tools
    runs-on: windows-latest
    # The catalog's Windows entries are bash scripts driving native .exe tools through Git Bash.
    # Nothing else in CI exercises that bridge: the unit suite mocks the shell, and the compile
    # jobs never run a script. TASKS.md tracked this as an open question for months because
    # answering it needed a Windows machine.
    steps:
      - uses: actions/checkout@v4
      # `shell: bash` on a Windows runner *is* Git Bash, which is exactly what the tool assumes
      # for Windows entries — so this exercises the real execution path, not an approximation.
      - name: Probe the native-tool bridge
        shell: bash
        run: bash scripts/windows-invocation-check.sh

      # install.ps1 cannot be syntax-checked on Linux, where the rest of CI runs, so a broken
      # installer would otherwise reach users before anyone parsed it. Parsing is not execution:
      # it never downloads or installs anything.
      # The PowerShell inside every windows/run.sh reaches the shell through bash, where a
      # mis-escaped backslash or dollar sign silently changes the command. That class of bug has
      # shipped here before, and none of these 37 scripts has ever been executed on Windows.
      # Parsing is not execution: it starts no application.
      - name: Parse the PowerShell inside every windows/run.sh
        shell: bash
        run: |
          failed=0
          for f in catalog/*/windows/run.sh; do
            [ -e "$f" ] || continue
            # Expand through bash exactly as the runner would, capturing the -Command argument.
            script=$(sed 's|^powershell.exe|printf "%s\\n" |' "$f" | bash | tail -n +3)
            # Written beside the checkout and referenced relatively, because Git Bash and
            # PowerShell do not share a path namespace: bash's /tmp/x is PowerShell's D:\tmp\x,
            # which does not exist. A relative path resolves against the same working directory in
            # both. This is the same trap the Windows entries themselves have to avoid.
            printf '%s' "$script" > ps-fragment.ps1
            pwsh -NoProfile -Command '
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                (Resolve-Path "ps-fragment.ps1"), [ref]$null, [ref]$errors) | Out-Null
              if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
            ' || { echo "PowerShell parse error in $f"; failed=1; }
            rm -f ps-fragment.ps1
          done
          exit $failed

      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host "install.ps1 parses cleanly"

  compile:
    name: Compile for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          # Released but previously never compile-checked here, so a break in it would only have
          # surfaced during a release build.
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # All targets cross-compile from Linux. The catalog is embedded with --include; the binary
      # extracts it at startup because a spawned `bash` cannot read Deno's virtual filesystem.
      - name: Compile
        run: |
          deno compile --target ${{ matrix.target }} \
            --allow-read --allow-run --allow-write --allow-env --allow-net \
            --include ./catalog --include ./profiles \
            --output "dist/autoinstall-${{ matrix.target }}" main.tsx

      - uses: actions/upload-artifact@v4
        with:
          name: autoinstall-${{ matrix.target }}
          path: dist/
