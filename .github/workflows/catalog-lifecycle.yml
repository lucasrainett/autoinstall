# The fix for this project's largest verification gap: every macOS and Windows entry is verified
# only against package registries and vendor docs, and has never actually been executed.
# GitHub-hosted runners are real macOS (Apple Silicon) and Windows machines with admin rights, so
# they can run the same full lifecycle the Linux container harness runs.
#
# Deliberately NOT a dry-run smoke test. The bugs this project has actually shipped — a gpg prompt
# that only appears on the second run, an installer that refuses when already present, a flatpak
# command that is ambiguous when two remotes are configured — are all invisible to anything that
# does not install, re-install and remove for real.
name: Catalog lifecycle

on:
  workflow_dispatch:
    inputs:
      entries:
        description: 'Space-separated entry keys, or "all" for every entry on each platform'
        required: false
        default: "all"
  schedule:
    # Weekly rather than per-PR: these install real software from third-party endpoints, so a
    # failure is as likely to mean "vendor had a bad day" as "we broke something". Keeping it off
    # the PR path stops flaky upstreams from training everyone to ignore red builds.
    - cron: "0 4 * * 1"

jobs:
  lifecycle:
    name: Lifecycle on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Installing real software from real vendors is slow; the default 360-minute cap is generous
    # but a hung installer should not hold a runner for six hours.
    #
    # Raised from 120 after a full Windows run reached only 48 of 112 entries before being
    # cancelled — with per-operation timeouts now bounding any single hang, the cap only needs to
    # accommodate the honest total. Each platform is its own job, so this costs nothing when a
    # platform finishes early.
    timeout-minutes: 180
    strategy:
      fail-fast: false   # one platform's failure must not hide another's result
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # GitHub's Linux runners ship neither flatpak nor the Flathub remote, so without this every
      # flatpak entry — and every AppImage entry, since those install through Gear Lever which is
      # itself a flatpak — would fail permanently and train everyone to ignore this workflow.
      - name: Install flatpak (Linux runners only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Select the platform folder to exercise
        id: plat
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   echo "dir=linux"   >> "$GITHUB_OUTPUT" ;;
            macOS)   echo "dir=macos"   >> "$GITHUB_OUTPUT" ;;
            Windows) echo "dir=windows" >> "$GITHUB_OUTPUT" ;;
          esac

      # The logic lives in scripts/lifecycle.sh so it can be read, syntax-checked and run by hand
      # against a VM — the same property every catalog script has, and for the same reason.
      #
      # `shell: bash` on the Windows runner is Git Bash, which is exactly what the tool itself
      # assumes for Windows entries, so this exercises the real execution path rather than a
      # PowerShell approximation of it.
      - name: Run the lifecycle
        id: run
        shell: bash
        env:
          LIFECYCLE_LOG_DIR: lifecycle-logs
        run: |
          bash scripts/lifecycle.sh "${{ steps.plat.outputs.dir }}" \
            ${{ github.event.inputs.entries || 'all' }}

      # Uploaded whether the run passed or failed — a failure is precisely when the per-entry
      # output is worth keeping, and Actions console logs are awkward to diff between weeks.
      - name: Collect per-entry logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-${{ matrix.os }}
          path: lifecycle-logs/
          retention-days: 90
          if-no-files-found: warn

  binary:
    name: Run the compiled binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Cross-compiling produces a correctly-formatted binary but proves nothing about whether it
      # runs. This executes it natively — the step that has never been done for macOS or Windows.
      #
      # --dry-run on a fresh runner also exercises first-run seeding: with no saved selection it
      # must seed from what the image already has and plan nothing, rather than proposing to strip
      # the machine. That regression shipped once and is worth catching here.
      - name: Compile and dry-run natively
        shell: bash
        run: |
          deno task compile
          bin=dist/autoinstall
          [ "${{ runner.os }}" = "Windows" ] && bin=dist/autoinstall.exe
          "$bin" --dry-run | tee dry-run.txt

          if grep -qE "^  remove " dry-run.txt; then
            echo "::error::a first run on a clean machine proposed removals — first-run seeding is broken"
            exit 1
          fi

      - name: Collect the dry-run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ matrix.os }}
          path: dry-run.txt
          retention-days: 90
          if-no-files-found: warn
